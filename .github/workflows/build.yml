name: build

on:
  push:
    branches: [main]
    tags: ["*-v*"]
  pull_request:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: |
          sudo apt-get update
          sudo apt-get install -y libgl1 libglu1-mesa
          python -m pip install --upgrade pip
          python -m pip install cadquery==2.8.0
      - name: Build and fit checks
        run: python build.py
      - uses: actions/upload-artifact@v4
        with:
          name: files
          path: designs/*/files/
      - name: Attach files to the release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          design="${GITHUB_REF_NAME%-v*}"
          gh release create "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" \
            --notes "Built by CI from $GITHUB_SHA. See designs/$design/README.md for the test state." \
            designs/"$design"/files/* || \
          gh release upload "$GITHUB_REF_NAME" designs/"$design"/files/* --clobber
